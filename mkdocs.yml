# ============================================================================
# កំណត់រចនាសម្ព័ន្ធ MkDocs សម្រាប់ឯកសារភាសាខ្មែរនៃ Target Quest
# (MkDocs configuration for the Target Quest Khmer documentation)
#
# ឯកសារយោង (References):
# - MkDocs: https://www.mkdocs.org/getting-started/
# - Material for MkDocs: https://squidfunk.github.io/mkdocs-material/
# - Read the Docs (MkDocs): https://docs.readthedocs.com/platform/stable/intro/mkdocs.html
# ============================================================================

site_name: "Target Quest — ឯកសារសិក្សាភាសាខ្មែរ"
site_description: >-
  ឯកសារសិក្សាភាសាខ្មែរសម្រាប់ហ្គេម Target Quest (Godot Engine) —
  ការពន្យល់កូដ GDScript ម៉ាស៊ីនបង្កើតកម្រិតស្វ័យប្រវត្តិ រូបវិទ្យាព្រួញ
  និងរបៀប deploy លើ Read the Docs។
site_author: "SeyhaLite"

# Read the Docs នឹងជំនួស URL នេះដោយស្វ័យប្រវត្តិតាម READTHEDOCS_CANONICAL_URL
# ពេល build លើ RTD។ តម្លៃ fallback ខាងក្រោមគឺជា URL រំពឹងទុក
# (អាចខុស ប្រសិនបើ slug នៅលើ RTD ខុសពីឈ្មោះ repository)។
site_url: !ENV [READTHEDOCS_CANONICAL_URL, 'https://target-quest-khmer-docs.readthedocs.io/']

repo_url: https://github.com/SeyhaLite/Target-Quest-Khmer-Docs
repo_name: SeyhaLite/Target-Quest-Khmer-Docs
# ខ្សែភ្ជាប់ "កែសម្រួល" → GitHub web editor (អ្នកអានមិនមានសិទ្ធិ write នឹងត្រូវបាន
# GitHub ណែនាំឱ្យ fork + បើក Pull Request ដោយស្វ័យប្រវត្តិ)
edit_uri: edit/main/docs/

# ឯកសារកូដ Python របស់ hook មិនត្រូវចេញលើគេហទំព័រទេ (build-only)
exclude_docs: |
  hooks/
  __pycache__/
  *.pyc

# Hook បន្ថែមរបារ "ចូលរួមកែលម្អឯកសារ" បែប GitHub នៅចុងទំព័រនីមួយៗ
# (កែ / មើលប្រភព / រាយការណ៍បញ្ហា / ស្នើឯកសារថ្មី / ប្រវត្តិ commit)
hooks:
  - docs/hooks/contribute.py

copyright: >-
  កូដដើមរក្សាសិទ្ធិ © 2026 KernelVoltage (MIT License) —
  ឯកសារភាសាខ្មែរនេះជាគម្រោងឯករាជ្យ មិនមែនផ្លូវការពី KernelVoltage ទេ។

theme:
  name: material
  # សម្គាល់៖ Material for MkDocs មិនទាន់មាន UI ជាភាសាខ្មែរ (km) ទេ
  # ដូច្នេះយើងប្រើ en សម្រាប់ UI ហើយមាតិកាទាំងអស់ជាភាសាខ្មែរ។
  # ប្រភព: https://squidfunk.github.io/mkdocs-material/setup/changing-the-language/
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Kantumruy Pro
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: ប្តូរទៅរបៀបងងឹត
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: ប្តូរទៅរបៀបភ្លឺ
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    # ប៊ូតុងកែសម្រួល/មើលប្រភព នៅជិតចំណងជើងទំព័រ (រូបតំណាងខ្នាតតូច)
    # ប្រភព: https://squidfunk.github.io/mkdocs-material/setup/setting-up-versioning/#content-action-edit
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    edit: octicons/pencil-16
    view: octicons/eye-16
    repo: octicons/mark-github-16

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/diagram-viewer.js

# ការកំណត់សម្រាប់ hook `docs/hooks/contribute.py` (របារចូលរួមបែប GitHub)
# ប្តូរតម្លៃទាំងនេះបានដោយមិនចាំបាច់កែកូដ Python។
extra:
  github:
    enabled: true
    branch: main
    docs_dir: docs
    issue_template: docs-issue.yml   # ឯកសារក្នុង .github/ISSUE_TEMPLATE/
    issue_label: documentation       # label ដែល GitHub ដាក់ឱ្យស្វ័យប្រវត្តិ

nav:
  - ទំព័រដើម: index.md
  - ចាប់ផ្តើម:
      - Target Quest ជាអ្វី?: getting-started/introduction.md
      - ដំឡើង Godot Engine: getting-started/install-godot.md
      - ដំណើរការ និងលេងហ្គេម: getting-started/run-and-play.md
  - មូលដ្ឋានគ្រឹះ:
      - គោលគំនិត Godot ដែលប្រើក្នុងគម្រោង: fundamentals/godot-concepts.md
      - រចនាសម្ព័ន្ធគម្រោង: fundamentals/project-structure.md
  - ស្ថាបត្យកម្ម:
      - ទិដ្ឋភាពទូទៅនៃប្រព័ន្ធ: architecture/overview.md
      - លំហូរហ្គេម និងវដ្តកម្រិត: architecture/game-loop.md
  - មេរៀនកូដ:
      - តួអង្គ និងយន្តការបាញ់ព្រួញ: lessons/player.md
      - ព្រួញ និងរូបវិទ្យា: lessons/arrow.md
      - ស៊ុតគោលដៅ និងប្រព័ន្ធខូចខាត: lessons/egg.md
      - ការបង្កើតកម្រិតស្វ័យប្រវត្តិ: lessons/levels.md
  - អនុវត្តជាក់ស្តែង:
      - កែប្រែហ្គេមដោយខ្លួនឯង: tutorials/customize.md
  - ឯកសារយោង:
      - ស្គ្រីប និងអនុគមន៍: reference/scripts.md
      - ការកំណត់រចនាសម្ព័ន្ធ: reference/config.md
  - troubleshooting.md
  - glossary.md
