# ============================================================================
# docs-build.yml — CI សម្រាប់ឯកសារ MkDocs
#
# គោលបំណង៖ ផ្តល់មតិយោបល់ភ្លាមៗលើ Pull Request ថាតើឯកសារនៅ build បាន។
# Read the Docs នៅតែជាអ្នកដាក់ពង្រាយពិតប្រាកដ (workflow នេះគ្រាន់តែពិនិត្យ)។
#
# ឯកសារយោង៖
#   - https://docs.github.com/en/actions/writing-workflows
#   - https://docs.readthedocs.com/platform/stable/intro/mkdocs.html
# ============================================================================

name: docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# បើ push ថ្មីមកលើ PR ដូចគ្នា → បញ្ឈប់ run ចាស់
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ទាញយក history ពេញ — hook ឬ plugin ណាដែលប្រើ git នឹងត្រូវការវា
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Validate MkDocs config
        run: python -m mkdocs build --strict --clean

      - name: Check hooks import cleanly
        run: |
          python -m compileall -q docs/hooks
          echo "✔ hooks OK"

      - name: Verify contribute bar rendered on every page
        run: |
          total=$(find site -name 'index.html' | wc -l)
          with_bar=$(grep -rl 'gh-contribute' site --include='index.html' | wc -l)
          echo "pages: $total, with contribute bar: $with_bar"
          if [ "$total" -eq 0 ]; then echo "no pages built" >&2; exit 1; fi
          if [ "$with_bar" -lt "$((total - 1))" ]; then
            echo "contribute bar missing on some pages" >&2
            exit 1
          fi

      - name: Upload built site (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: site
          retention-days: 7
